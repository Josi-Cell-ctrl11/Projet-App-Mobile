name: ozelservices
description: OZELSERVICES BENIN — super-app MVP (OzelFoods + Rapid Colis).
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # État & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Réseau (prêt pour API Laravel + intercepteur mock)
  dio: ^5.8.0+1

  # Cartes & médias
  # google_maps_flutter: ^2.10.0  # Desactive temporairement — cartes mockees en attendant cle API
  image_picker: ^1.1.2

  # Firebase (FCM + Auth + Crashlytics + Firestore + Analytics)
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1
  firebase_auth: ^5.3.1
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.6.0
  firebase_analytics: ^11.3.3

  # Paiement FedaPay (WebView)
  webview_flutter: ^4.9.0

  # Stockage local
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
