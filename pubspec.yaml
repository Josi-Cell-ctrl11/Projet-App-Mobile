name: ozelservices_livreur
description: Application OZELSERVICES pour les livreurs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.3
  go_router: ^14.8.1
  dio: ^5.8.0+1
  # google_maps_flutter: ^2.10.0  # Désactivé — carte mockée en attendant clé API
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1
  firebase_auth: ^5.3.1
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.6.0
  firebase_analytics: ^11.3.3
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
